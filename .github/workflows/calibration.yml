name: Aeon Scorer v3.2 quality
on:
  pull_request:
    branches: [main, public-precon-library]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Pin mid-power validation cohort
        run: |
          mkdir -p calibration/cache
          cat > calibration/cache/arch_listing_MegazZ31.json <<'EOF'
          {"results":[{"id":25464836},{"id":25449616},{"id":18888572},{"id":24925767},{"id":25449328},{"id":23299336},{"id":23299341},{"id":23294619},{"id":25448552}]}
          EOF
      - name: Smoke test
        run: npm run smoke
      - name: Micro semantic truth tests
        run: npm run test:semantic
      - name: Metamorphic independent verification
        run: npm run test:metamorphic
      - name: Product contracts
        run: npm run test:product
      - name: Adversarial audit
        run: npm run audit
      - name: Build application
        run: npm run build
      - name: Public precon library contract
        run: npm run test:public-precons
      - name: Macro benchmark 1800
        env:
          AEON_BENCH_ITERATIONS: '1800'
          ARCHIDEKT_USERNAME: 'MegazZ31'
        run: npm run benchmark
      - name: Validate macro gates 1800
        run: npm run validate:calibration
      - name: Save 1800 report
        run: cp calibration/latest.json calibration/run-1800.json
      - name: Macro benchmark 3200
        env:
          AEON_BENCH_ITERATIONS: '3200'
          ARCHIDEKT_USERNAME: 'MegazZ31'
        run: npm run benchmark
      - name: Validate macro gates 3200
        run: npm run validate:calibration
      - name: Save 3200 report
        run: cp calibration/latest.json calibration/run-3200.json
      - name: Cross-iteration convergence
        run: node scripts/compare-sampling.mjs
      - name: Print final report
        if: always()
        run: cat calibration/latest.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3.2-validation-report
          path: |
            calibration/latest.json
            calibration/latest.md
            calibration/run-1800.json
            calibration/run-3200.json
          if-no-files-found: warn
