name: Aeon Quality and Calibration

on:
  push:
    branches:
      - main
      - release/v3.3.0-semantic-14
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aeon-calibration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Smoke test
        run: npm run smoke
      - name: Generate current semantic precon snapshots for sentinel gates
        env:
          AEON_PRECON_ITERATIONS: '3200'
        run: npm run precons:generate
      - name: Semantic truth + sentinel precons
        run: npm run test:semantic:fast
      - name: Metamorphic independent verification
        run: npm run test:metamorphic
      - name: Product contracts
        run: npm run test:product
      - name: Public precon library contract
        run: npm run test:public-precons
      - name: Adversarial audit
        run: npm run audit
      - name: Build application
        run: npm run build
      - name: Quality local
        run: npm run quality:local
      - name: Pin mid-power validation cohort
        run: |
          mkdir -p calibration/cache
          cat > calibration/cache/arch_listing_MegazZ31.json <<'EOF'
          {"results":[{"id":25464836},{"id":25449616},{"id":18888572},{"id":24925767},{"id":25449328},{"id":23299336},{"id":23299341},{"id":23294619},{"id":25448552}]}
          EOF
      - name: Macro benchmark 1800
        env:
          AEON_BENCH_ITERATIONS: '1800'
          ARCHIDEKT_USERNAME: 'MegazZ31'
        run: |
          npm run benchmark
          npm run validate:calibration
          node scripts/stamp-calibration-report.mjs
          cp calibration/latest.json calibration/run-1800.json
      - name: Macro benchmark 3200
        env:
          AEON_BENCH_ITERATIONS: '3200'
          ARCHIDEKT_USERNAME: 'MegazZ31'
        run: |
          npm run benchmark
          npm run validate:calibration
          node scripts/stamp-calibration-report.mjs
          cp calibration/latest.json calibration/run-3200.json
      - name: Verify sampling convergence
        run: node scripts/compare-sampling.mjs
      - name: Print final report
        if: always()
        run: cat calibration/latest.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3.3.0-calibration-report
          path: |
            calibration/latest.json
            calibration/latest.md
            calibration/run-1800.json
            calibration/run-3200.json
            calibration/semantic-precon-delta.json
            calibration/semantic-precon-delta.md
          if-no-files-found: warn
