name: Aeon Scorer v3.1 quality
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Smoke test
        run: npm run smoke
      - name: Micro semantic truth tests
        run: npm run test:semantic
      - name: Metamorphic independent verification
        run: npm run test:metamorphic
      - name: Adversarial audit
        run: npm run audit
      - name: Build application
        run: npm run build
      - name: Macro 30+ deck benchmark
        env:
          AEON_BENCH_ITERATIONS: '1800'
          ARCHIDEKT_USERNAME: 'MegazZ31'
        run: npm run benchmark
      - name: Validate macro quality gates
        run: npm run validate:calibration
      - name: Print report
        if: always()
        run: cat calibration/latest.md || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v3.1-validation-report
          path: |
            calibration/latest.json
            calibration/latest.md
          if-no-files-found: warn
