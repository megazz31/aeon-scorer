name: Semantic16 materialize
on:
  push:
    branches: [main]
    paths:
      - 'scripts/semantic16-single-commander-mechanics-patch.mjs'
      - 'scripts/semantic16-ramp-planner-patch.mjs'
      - 'scripts/semantic16-ramp-planner-regression-test.mjs'
      - '.github/workflows/semantic16-materialize.yml'
permissions:
  contents: write
concurrency:
  group: semantic16-materialize-main
  cancel-in-progress: true
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply semantic16 materialization patches
        run: |
          node scripts/semantic16-single-commander-mechanics-patch.mjs
          node scripts/semantic16-ramp-planner-patch.mjs
      - name: Syntax check materialized simulators
        run: |
          node --check src/engine/sequenceSimulator.js
          node --check src/engine/sequenceSimulatorMulti.js
      - name: Run focused ramp planner regression
        run: node scripts/semantic16-ramp-planner-regression-test.mjs
      - name: Commit materialized engine
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/sequenceSimulator.js src/engine/sequenceSimulatorMulti.js
          if ! git diff --cached --quiet; then
            git commit -m "fix(semantic16): prioritize castable commanders and model net land ramp"
            for attempt in 1 2 3; do
              if git push origin HEAD:main; then exit 0; fi
              git fetch origin main
              git rebase origin/main
            done
            exit 1
          fi
