name: Semantic16 user corpus materialize
on:
  push:
    branches: [semantic/16-user-corpus-audit]
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: semantic/16-user-corpus-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize user-corpus commander fixes
        run: node scripts/materialize-user-corpus-commander-fixes.mjs
      - name: Materialize Equipment package precision
        run: node scripts/materialize-equipment-package-precision.mjs
      - name: Materialize Equipment sequence gating
        run: node scripts/materialize-equipment-sequence-gating.mjs
      - name: Materialize combo timing eligibility
        run: node scripts/materialize-combo-sequence-eligibility.mjs
      - name: Syntax checks
        run: |
          node --check src/engine/commanderSynergyPatterns.js
          node --check src/engine/packageGraph.js
          node --check src/engine/knownCombos.js
          node --check src/engine/sequenceSimulator.js
          node --check src/engine/powerModel.js
          node --check scripts/user-corpus-commander-regression-test.mjs
          node --check scripts/user-corpus-combo-regression-test.mjs
          node --check scripts/equipment-package-precision-test.mjs
          node --check scripts/equipment-sequence-gating-test.mjs
          node --check scripts/materialize-equipment-package-precision.mjs
          node --check scripts/materialize-equipment-sequence-gating.mjs
          node --check scripts/materialize-combo-sequence-eligibility.mjs
      - name: Focused regressions
        run: |
          node scripts/user-corpus-commander-regression-test.mjs
          node scripts/user-corpus-combo-regression-test.mjs
          node scripts/equipment-package-precision-test.mjs
          node scripts/equipment-sequence-gating-test.mjs
          node scripts/semantic15-audit-regression-test.mjs
          node scripts/semantic16-commander-compression-test.mjs
      - name: Commit materialized files
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/packageGraph.js src/engine/sequenceSimulator.js src/engine/powerModel.js package.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(semantic16): keep Equipment timing sequence-safe"
            git push origin HEAD:semantic/16-user-corpus-audit
          fi
