name: Aeon semantic auditor

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  models: read
  id-token: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit queued Aeon analyses
        run: node scripts/semantic-auditor-worker.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
