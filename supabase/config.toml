[auth]
enabled = true
site_url = "https://aeon-scorer.vercel.app"
additional_redirect_urls = ["https://aeon-scorer.vercel.app/**", "https://aeon-scorer.vercel.app", "http://localhost:3000", "http://localhost:5173", "https://mon-simulateur-mtg.vercel.app/**", "io.supabase.monsimulateurmtg://*"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

[auth.mfa]
max_enrolled_factors = 10
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[storage]
enabled = true

[storage.vector]
enabled = false

[functions.record-analysis]
verify_jwt = false
